[package]
name = "app"
version = "0.3.2"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.4", features = [] }
tauri-plugin-log = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
tauri-plugin-opener = "2.7.2"
tauri-plugin-process = "2.4.0"

# Disable incremental compilation for debug builds. This toolchain (rustc 1.99.0 /
# MSVC) hits an internal compiler error (`rustc_metadata::encode_metadata`
# panic) in the `app` crate when incremental artifacts are used. Disabling it
# makes `tauri dev` rebuilds stable. Safe to remove once the toolchain is updated.
[profile.dev]
incremental = false

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2.14.1"
